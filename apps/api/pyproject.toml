[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scraptrace-api"
version = "0.1.0"
description = "ScrapTrace application API: persistence, authentication, recovery records and vision"
requires-python = ">=3.10,<3.13"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.20.0",
  "anyio==4.14.2",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "httpx2==2.12.0",
  "jsonschema==4.24.0",
  "pillow==12.3.0",
  "pydantic==2.11.7",
  "pyjwt==2.15.0",
  "python-multipart==0.0.31",
  "sqlalchemy[asyncio]==2.0.54",
  "starlette==1.3.1",
  "timm==1.0.16",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.16.1",
  "openapi-spec-validator==0.7.2",
  "pip-audit==2.10.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.0.0",
  "ruff==0.12.3",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../../services/vision/tests"]
pythonpath = ["../.."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["../../services/vision/download_data.py", "../../services/vision/extract_crops.py", "../../services/vision/train.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated constraint and index names exceed the line length.
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["apps.api.app", "services.vision.manifest", "services.vision.predictor"]
exclude = ["services/vision/(download_data|extract_crops|train|dataset|model)\\.py"]

[[tool.mypy.overrides]]
module = ["PIL.*", "jsonschema.*", "torch.*", "torchvision.*", "timm.*", "asyncpg.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["services.vision.dataset", "services.vision.model"]
follow_imports = "skip"
ignore_errors = true
