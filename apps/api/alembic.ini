# Alembic configuration for the ScrapTrace API.
#
# The database URL is never stored here. It is read from SCRAPTRACE_DATABASE_URL (or passed
# programmatically through `Config.attributes["database_url"]`). Run from the repository root:
#
#   npm run api:db:migrate

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
